<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse Festival - Gallery</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .gallery-item {
            width: 100%;
            height: 200px;
            background-color: #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.8rem;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">NEON PULSE</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="eventi.html">Eventi</a></li>
                <li><a href="info.html">Info</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="registrazione.html">Prenota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Gallery Edizioni Precedenti</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1459749411177-042180ce673c?auto=format&fit=crop&w=500&q=60" alt="Concert 1"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=500&q=60" alt="Concert 2"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=500&q=60" alt="Concert 3"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=500&q=60" alt="Concert 4"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1429962714451-bb934ecdc4ec?auto=format&fit=crop&w=500&q=60" alt="Concert 5"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1514525253361-bee8718a340b?auto=format&fit=crop&w=500&q=60" alt="Concert 6"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Neon Pulse Festival. Tutti i diritti riservati.</p>
    </footer>
</body>
</html>
