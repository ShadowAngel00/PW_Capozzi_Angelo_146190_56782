<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Biglietti - Neon Pulse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Prenotazione Biglietti</h1>
            <a href="../Sito_HTML/registrazione.html" class="back-link">← Torna al sito</a>
        </header>

        <main class="container">
            <form id="booking-form">
                <div class="form-group">
                    <label for="name">Nome Partecipante:</label>
                    <input type="text" id="name" required placeholder="Inserisci il tuo nome">
                </div>

                <div class="form-group">
                    <label for="age">Età:</label>
                    <input type="number" id="age" required min="0" placeholder="La tua età">
                </div>

                <div class="form-group">
                    <label for="tickets">Numero di Biglietti (Max 5):</label>
                    <input type="number" id="tickets" required min="1" max="10" value="1">
                </div>

                <div class="form-group">
                    <label for="type">Tipo di Ingresso:</label>
                    <select id="type" required>
                        <option value="standard">Standard (Età min. 16)</option>
                        <option value="vip">VIP (Età min. 18)</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn">CONFERMA PRENOTAZIONE</button>
            </form>

            <div id="result-message" class="message hidden"></div>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
