<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Biglietti - Neon Pulse</title>
    <link rel="stylesheet" href="../Sito_Web/style/style.css">
</head>
<body>
    <!-- Applicativo Booking: pagina di prenotazione unica -->
    <div id="app">
        <!-- Header dell'applicativo con titolo e link per tornare al sito -->
        <header>
            <h1>Prenotazione Biglietti</h1>
            <a href="../Sito_Web/registrazione.html" class="back-link">← Torna al sito</a>
        </header>

        <!-- Contenitore del modulo di prenotazione -->
        <main class="container">
            <!-- Modulo di prenotazione con campi per nome, età, biglietti e tipo -->
            <form id="booking-form">
                <div class="form-group">
                    <label for="name">Nome Partecipante:</label>
                    <input type="text" id="name" required placeholder="Inserisci il tuo nome">
                </div>

                <div class="form-group">
                    <label for="age">Età:</label>
                    <input type="number" id="age" required min="0" placeholder="La tua età">
                </div>

                <div class="form-group">
                    <label for="tickets">Numero di Biglietti (Max 5):</label>
                    <input type="number" id="tickets" required min="1" max="5" value="1">
                </div>

                <div class="form-group">
                    <label for="type">Tipo di Ingresso:</label>
                    <select id="type" required>
                        <option value="standard">Standard (Età min. 16)</option>
                        <option value="vip">VIP (Età min. 18)</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn">CONFERMA PRENOTAZIONE</button>
            </form>

            <!-- Messaggio di esito prenotazione (successo o errore) -->
            <div id="result-message" class="message hidden"></div>
        </main>
    </div>
    <script src="https://unpkg.com/typescript@latest/lib/typescript.js"></script>
    <script>
        async function loadTypeScriptApp() {
            const resultMessage = document.getElementById('result-message');
            
            // Verifica se il file è aperto tramite protocollo file://
            if (window.location.protocol === 'file:') {
                if (resultMessage) {
                    resultMessage.innerHTML = `
                        <strong>Errore di Sicurezza:</strong> Il browser blocca il caricamento di file TypeScript se apri il file HTML direttamente.<br><br>
                        <strong>Soluzione:</strong><br>
                        1. Avvia il server nel terminale con <code>npm start</code><br>
                        2. Apri <a href="http://localhost:3000/Applicativo/prenotazione.html" target="_blank">http://localhost:3000/Applicativo/prenotazione.html</a>
                    `;
                    resultMessage.className = 'message error';
                    resultMessage.classList.remove('hidden');
                }
                return;
            }
            
            try {
                const response = await fetch(`script.ts?v=${Date.now()}`);
                if (!response.ok) {
                    throw new Error(`Impossibile recuperare script.ts (Stato: ${response.status}). Assicurati di aver avviato il server con 'npm start' e di accedere tramite http://localhost:3000`);
                }
                const tsSource = await response.text();
                
                if (typeof ts === 'undefined') {
                    throw new Error("Il compilatore TypeScript non è stato caricato. Verifica la connessione internet.");
                }

                const compiled = ts.transpileModule(tsSource, {
                    compilerOptions: {
                        module: ts.ModuleKind.None,
                        target: ts.ScriptTarget.ES2020,
                        strict: true
                    }
                }).outputText;

                const script = document.createElement('script');
                script.textContent = compiled;
                document.body.appendChild(script);
                console.log('Script TypeScript caricato e compilato con successo.');
            } catch (error) {
                console.error('Errore durante il caricamento di script.ts:', error);
                if (resultMessage) {
                    resultMessage.textContent = `Errore: ${error.message}`;
                    resultMessage.className = 'message error';
                    resultMessage.classList.remove('hidden');
                }
            }
        }

        loadTypeScriptApp();
    </script>
</body>
</html>
